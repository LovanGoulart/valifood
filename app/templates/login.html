
{% extends "base.html" %}

{% block title %}Entrar - ValiFood{% endblock %}

{% block content %}
<main class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <div class="logo-icon" aria-hidden="true">🥗</div>
            <h1>ValiFood</h1>
            <p>Controle inteligente de alimentos e validade</p>
        </div>

        <form
            method="POST"
            action="{{ url_for('auth.login') }}"
            class="auth-form"
        >

            <div class="form-group">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="seu@email.com"
                    autocomplete="email"
                    required
                    autofocus
                >
            </div>

            <div class="form-group">
                <label for="password">Senha</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Sua senha"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="form-checkbox">
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                >

                <label for="remember">
                    Lembrar de mim
                </label>
            </div>

            <button
                type="submit"
                class="btn btn-primary btn-block"
            >
                Entrar
            </button>

        </form>

        <div class="auth-footer">
            <p>
                Não tem uma conta?
                <a href="{{ url_for('auth.register') }}">
                    Cadastre-se
                </a>
            </p>
        </div>

    </div>
</main>
{% endblock %}
